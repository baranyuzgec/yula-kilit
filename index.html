<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b0d"><title>Umaykut Kilit Mobil</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;background:#080b0d;color:#eadbb8;font-family:Segoe UI,Arial,sans-serif}.app{max-width:520px;margin:auto;padding:12px}.top{display:flex;gap:10px;align-items:center;padding:8px 4px 14px}.logo{width:42px;height:42px;border:1px solid #70572d;border-radius:10px;display:grid;place-items:center;background:#151d22;font-size:22px}.top h1{font:700 21px Georgia;margin:0;color:#e8b94e}.top small{color:#87939a}.card{background:linear-gradient(145deg,#12191d,#0c1114);border:1px solid #303b40;border-radius:14px;padding:13px;margin-bottom:11px}.title{font:700 15px Georgia;color:#e8b94e;margin-bottom:10px;text-transform:uppercase}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font-size:11px;color:#849197;margin:0 0 4px 3px}.field input,.field select{width:100%;height:43px;border:1px solid #354248;border-radius:9px;background:#0a0f12;color:#f1e6c9;padding:0 10px;font-size:15px}.row{display:flex;gap:7px}.row>*{flex:1}.btn{width:100%;min-height:44px;border-radius:9px;background:linear-gradient(#705324,#493519);border:1px solid #8e6b32;color:#f5e8c7;font-weight:800}.btn.secondary{background:#171f23;border-color:#465157}.soldier{border:1px solid #354248;border-radius:9px;padding:9px;background:#0b1013;margin-top:8px}.chips{display:flex;gap:6px;overflow:auto;margin-bottom:8px}.chip{border:1px solid #3d4a50;background:#151d22;color:#cbbf9f;border-radius:18px;padding:7px 11px;white-space:nowrap}.chip.active{background:#6a4e23;color:#fff2c9}.soldier-list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.soldier-btn{min-height:55px;border-radius:8px;border:1px solid #2f3a3f;background:#121a1e;color:#ddcfac;font-size:11px;font-weight:700}.soldier-btn strong{display:block;color:#e8b94e;margin-top:3px}.check{display:flex;align-items:center;gap:8px;margin-top:9px;color:#75cfff;font-size:12px;font-weight:800}.check input{width:18px;height:18px;accent-color:#d5a43f}.result{display:grid;grid-template-columns:1fr 1fr;gap:7px}.box{background:#0a0f12;border:1px solid #303b40;border-radius:9px;padding:9px}.box.full{grid-column:1/-1}.k{font-size:10px;color:#7e8b91;text-transform:uppercase}.v{font-size:18px;font-weight:900;color:#e8b94e;margin-top:3px}.empty{text-align:center;color:#748086;padding:8px;grid-column:1/-1}.footer{text-align:center;color:#586268;font-size:10px;margin:10px}
</style></head><body><main class="app"><header class="top"><div class="logo">⚔</div><div><h1>UMAYKUT KİLİT</h1><small>Mobil saldırı hesaplayıcı</small></div></header>
<section class="card"><div class="title">Köylerim</div><div class="grid2"><div class="field"><label>Köy adı</label><input id="vname"></div><div class="field"><label>X</label><input id="vx" inputmode="numeric"></div><div class="field"><label>Y</label><input id="vy" inputmode="numeric"></div><button class="btn" onclick="addVillage()">+ Köy Kaydet</button></div><div id="villages" style="margin-top:9px"></div></section>
<section class="card"><div class="title">Savaş Köyleri</div>
<div class="field"><label>Düşmanın köyü</label><div class="grid2"><div><input id="ex" inputmode="numeric" placeholder="X"></div><div><input id="ey" inputmode="numeric" placeholder="Y"></div></div></div>
<div class="field" style="margin-top:10px"><label>Senin köyün</label><select id="sourceVillage"></select></div>
<div class="field" style="margin-top:10px"><label>Bizim düşmana saldıracağımız köy</label><select id="targetVillage" onchange="syncTargetVillage()"></select><div class="grid2" style="margin-top:7px"><div><input id="tx" inputmode="numeric" placeholder="X"></div><div><input id="ty" inputmode="numeric" placeholder="Y"></div></div></div>
<div class="field" style="margin-top:10px"><label>Düşmanın varış saati</label><div class="row"><input id="ah" inputmode="numeric" placeholder="HH"><input id="am" inputmode="numeric" placeholder="MM"><input id="as" inputmode="numeric" placeholder="SS"></div></div></section>
<section class="card"><div class="title">Düşman Askeri</div><button class="btn secondary" onclick="toggleSelector('enemy')"><span id="enemyBtn">Asker seç</span></button><div id="enemySelector" class="soldier" hidden></div><label class="check"><input type="checkbox" id="diamond"> ELMASLI GÖNDERİM — SÜRE YARIYA İNER</label></section>
<section class="card"><div class="title">Senin Askerin</div><button class="btn secondary" onclick="toggleSelector('mine')"><span id="mineBtn">Asker seç</span></button><div id="mineSelector" class="soldier" hidden></div> <label class="check"><input type="checkbox" id="mineDiamond"> 💎 ELMASLI GÖNDERİM — SÜRE YARIYA İNER</label></section>
<section class="card"><button class="btn" onclick="calculate()">⚔ HESAPLA</button><button class="btn secondary" style="margin-top:8px" onclick="clearAll()">Temizle</button></section>
<section class="card"><div class="title">Sonuç</div><div id="results" class="result"><div class="empty">Hesaplama bekleniyor...</div></div></section><div class="footer">Umaykut Kilit Mobil</div></main><script src="app.js"></script></body></html>
